openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scans
    description: Farmer crop scan records
  - name: weather
    description: Live field weather context
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scans:
    post:
      operationId: createScan
      tags: [scans]
      summary: Create a crop scan
      description: Stores farmer-provided crop details and GPS coordinates before analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanInput"
      responses:
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid scan data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scans/{scanId}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get a crop scan
      description: Returns one stored crop scan by its identifier.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Scan found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scans/{scanId}/image:
    post:
      operationId: uploadScanImage
      tags: [scans]
      summary: Upload a crop image
      description: Stores one genuine JPG or PNG image, up to 10 MB, for an existing scan.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadScanImageInput"
      responses:
        "200":
          description: Image stored and scan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image exceeds 10 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Image is not a genuine JPG or PNG file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getScanImage
      tags: [scans]
      summary: Get a crop image
      description: Streams the locally stored image for an existing scan.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Stored crop image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Scan or image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get current field weather
      description: Returns current Open-Meteo conditions for GPS coordinates without requiring an API key.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Current weather returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Live weather is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Crop:
      type: string
      enum:
        - Rice
        - Wheat
        - Maize
        - Cotton
        - Sugarcane
        - Soybean
        - Groundnut
        - Tomato
        - Potato
        - Onion
    CreateScanInput:
      type: object
      additionalProperties: false
      properties:
        crop:
          $ref: "#/components/schemas/Crop"
        symptoms:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
        affectedPart:
          type: string
          minLength: 1
          maxLength: 100
        growthStage:
          type: string
          minLength: 1
          maxLength: 100
        affectedAreaPercentage:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 100
        nearbyPlantsAffected:
          type: boolean
        notes:
          type: string
          maxLength: 2000
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - crop
        - latitude
        - longitude
    UploadScanImageInput:
      type: object
      properties:
        image:
          type: string
          format: binary
      required:
        - image
    Weather:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        temperatureCelsius:
          type: number
        relativeHumidityPercentage:
          type: number
        precipitationMm:
          type: number
        windSpeedKph:
          type: number
        weatherCode:
          type: number
          multipleOf: 1
        isDay:
          type: boolean
        observedAt:
          type: string
          format: date-time
        timezone:
          type: string
        source:
          type: string
          enum: [open-meteo]
        freshness:
          type: string
          enum: [live, cached]
      required:
        - latitude
        - longitude
        - temperatureCelsius
        - relativeHumidityPercentage
        - precipitationMm
        - windSpeedKph
        - weatherCode
        - isDay
        - observedAt
        - timezone
        - source
        - freshness
    Scan:
      allOf:
        - $ref: "#/components/schemas/CreateScanInput"
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [pending, analyzing, completed, failed]
            imagePath:
              type:
                - string
                - "null"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - status
            - imagePath
            - createdAt
            - updatedAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
          required:
            - code
            - message
      required:
        - error

